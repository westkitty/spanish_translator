name: Apply exhaustive bug sweep fixes

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'ui/adversarial-redesign-2026-07-14'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/adversarial-redesign-2026-07-14
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reconstruct and verify repair script
        id: reconstruct
        continue-on-error: true
        run: |
          python3 - <<'PY' > sweep-payload-fingerprints.txt 2>&1
          from pathlib import Path
          import base64, gzip, hashlib
          root = Path('.github/sweep-fix-b64')
          p0 = (root / 'part-00').read_bytes().strip()
          p1 = (root / 'part-01').read_bytes().strip()
          p2 = (root / 'part-02').read_bytes().strip()[:3621] + (root / 'tail-02').read_bytes().strip()
          p3 = (root / 'part-03').read_bytes().strip()[:1210] + (root / 'tail-03').read_bytes().strip()[:4887] + (root / 'tail-03-end').read_bytes().strip()
          expected_parts = [
              (6500, '618ce58b506ebef77e84e50172822e1b7bc7050aff59ed32b622cbc2dd9e3d64'),
              (6500, '22a40f3b7a09eab5aa2bc3727674dc0c4a95b47f7441d2c9e93f37a4158ce942'),
              (6500, '8a61fc7492d4cc8aeba1fb2b0ceb9b457039b2202ced442a2ba1f8c05e947506'),
              (6188, 'aa3458a9838eb95f58c5c2f11cebb6160a660ecbd196ea38c545b040986b11d0'),
          ]
          parts = [p0, p1, p2, p3]
          for index, (data, expected) in enumerate(zip(parts, expected_parts)):
              length, digest = len(data), hashlib.sha256(data).hexdigest()
              print(f'part-{index:02d}', length, digest)
              if (length, digest) != expected:
                  raise SystemExit(f'Part {index} fingerprint mismatch')
          raw = gzip.decompress(base64.b64decode(b''.join(parts)))
          digest = hashlib.sha256(raw).hexdigest()
          expected = '915c9f25b29a6c8cc730956f4546a317dacdf4a070da506a15de7f14107122cb'
          if digest != expected:
              raise SystemExit(f'Repair payload checksum mismatch: {digest}')
          target = Path('.github/scripts/apply_sweep_fixes.py')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(raw)
          print(f'Verified repair payload: {digest}')
          PY
      - name: Upload payload fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-sweep-payload-fingerprints
          path: sweep-payload-fingerprints.txt
      - name: Stop on reconstruction failure
        if: steps.reconstruct.outcome == 'failure'
        run: |
          cat sweep-payload-fingerprints.txt
          exit 1
      - name: Correct compiler-discovered migration event access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_sweep_fixes.py')
          text = path.read_text()
          old = "request.onupgradeneeded = () => {"
          new = "request.onupgradeneeded = (event) => {"
          if old not in text:
              raise SystemExit('Expected upgrade handler was not found')
          text = text.replace(old, new, 1)
          text = text.replace('if (request.oldVersion < 2) {', 'if (event.oldVersion < 2) {', 1)
          path.write_text(text)
          PY
      - name: Apply repair pass
        id: apply
        continue-on-error: true
        run: python3 .github/scripts/apply_sweep_fixes.py > exhaustive-sweep-apply.log 2>&1
      - name: Upload applicator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-bug-sweep-applicator-log
          path: exhaustive-sweep-apply.log
      - name: Stop on applicator failure
        if: steps.apply.outcome == 'failure'
        run: |
          cat exhaustive-sweep-apply.log
          exit 1
      - name: Clean install
        working-directory: frontend
        run: npm ci
      - name: Build
        id: build
        continue-on-error: true
        working-directory: frontend
        run: npm run build > ../exhaustive-sweep-build.log 2>&1
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhaustive-bug-sweep-build-log
          path: exhaustive-sweep-build.log
      - name: Stop on build failure
        if: steps.build.outcome == 'failure'
        run: |
          cat exhaustive-sweep-build.log
          exit 1
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Commit validated product fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src frontend/index.html frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ui): close exhaustive bug sweep findings'
          git push origin HEAD:ui/adversarial-redesign-2026-07-14
