name: Apply adversarial UI fixes

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'ui/adversarial-redesign-2026-07-14'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/adversarial-redesign-2026-07-14
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reconstruct and verify correction script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          encoded = ''.join(path.read_text().strip() for path in sorted(Path('.github/ui-fix-b64').glob('part-*')))
          raw = gzip.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(raw).hexdigest()
          expected = '9e24615e6ea7020ed3dab245ca071513f90ac6f30593fb84b3927e4e22ca7640'
          if digest != expected:
              raise SystemExit(f'Correction payload checksum mismatch: {digest}')
          target = Path('.github/scripts/apply_adversarial_ui_fixes.py')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(raw)
          print(f'Verified correction payload: {digest}')
          PY
      - name: Adapt match targets to current PR source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_adversarial_ui_fixes.py')
          text = path.read_text()
          text = text.replace('result-pane result-pane--spanish', 'result-pane flex flex-col gap-3.5 min-w-0')
          text = text.replace('result-pane result-pane--english', 'result-pane translation-pane')
          text = text.replace("# Pass audio availability to result readers and hide audio-only player/tools.\nreplace('frontend/src/App.tsx', '              <div className=\"player-card glass rounded-2xl p-4 space-y-3\">', '              {sourceAudioAvailable ? (\\n              <div className=\"player-card glass rounded-2xl p-4 space-y-3\">', 1)\n# Close player conditional immediately before the corrections block.\nreplace('frontend/src/App.tsx', \"              {/* \\\"Remember corrections\\\" inline link */}\", \"              ) : (\\n                <div className=\\\"state-message\\\" role=\\\"status\\\"><Info aria-hidden=\\\"true\\\" /><div><strong>Transcript-only project</strong><p>The source audio was not retained, so playback, seeking, clips, looping, and reprocessing are unavailable.</p></div></div>\\n              )}\\n\\n              {/* \\\"Remember corrections\\\" inline link */}\", 1)", "# Pass audio availability to result readers and disable audio-only tools for transcript-only projects.\nreplace('frontend/src/App.tsx', '              {file && file.size > 0 ? (', '              {sourceAudioAvailable ? (', 1)\nreplace('frontend/src/App.tsx', '<div className=\"state-message\"><Info aria-hidden=\"true\" /><div><strong>Transcript-only project</strong><p>The source audio was not retained, so playback and clip tools are unavailable.</p></div></div>', '<div className=\"state-message\" role=\"status\"><Info aria-hidden=\"true\" /><div><strong>Transcript-only project</strong><p>The source audio was not retained, so playback, seeking, clips, looping, and reprocessing are unavailable.</p></div></div>', 1)")
          path.write_text(text)
          PY
      - name: Apply correction pass
        id: apply
        continue-on-error: true
        run: python3 .github/scripts/apply_adversarial_ui_fixes.py > ui-apply.log 2>&1
      - name: Upload applicator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-ui-applicator-log
          path: ui-apply.log
      - name: Stop on applicator failure
        if: steps.apply.outcome == 'failure'
        run: |
          cat ui-apply.log
          exit 1
      - name: Clean install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Commit validated fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src frontend/index.html frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ui): resolve adversarial review findings'
          git push origin HEAD:ui/adversarial-redesign-2026-07-14
