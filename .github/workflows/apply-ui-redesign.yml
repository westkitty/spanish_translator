name: Validate UI redesign

on:
  push:
    branches:
      - ui/adversarial-redesign-2026-07-14
    paths:
      - .github/workflows/apply-ui-redesign.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Correct missing icon import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/App.tsx')
          source = path.read_text()
          old = '  AlertTriangle,\n  Info,\n  HelpCircle,'
          new = '  AlertTriangle,\n  Info,\n  Languages,\n  HelpCircle,'
          if old not in source:
              raise SystemExit('expected App.tsx import anchor not found')
          path.write_text(source.replace(old, new, 1))
          Path('frontend/UI_BUILD_ERRORS.txt').unlink(missing_ok=True)
          PY
      - name: Clean install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Commit validated correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend
          git diff --cached --quiet || git commit -m "fix(ui): restore result status icon import"
          git push
